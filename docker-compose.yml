services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flirty
      POSTGRES_PASSWORD: flirty_dev_local
      POSTGRES_DB: flirty
    ports:
      - "5432:5432"
    volumes:
      - flirty_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flirty"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: flirty
      MINIO_ROOT_PASSWORD: flirty_dev_local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - flirty_minio:/data
    profiles: ["object-storage"]

volumes:
  flirty_pg:
  flirty_minio:
